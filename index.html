<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Futuristic AI Avatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #0f172a, #020617);
            overflow: hidden;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

      
        .avatar-glow {
            position: relative;
            width: 200px;
            height: 200px;
            background: linear-gradient(145s, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.4),
                        inset 0 0 20px rgba(255, 255, 255, 0.3);
            animation: float 4s ease-in-out infinite;
        }

     
        .avatar-face {
            width: 160px;
            height: 160px;
            background: #1e293b;
            border-radius: 50%;
            border: 4px solid #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.6);
        }

        .eyes-container {
            display: flex;
            gap: 25px;
        }

        .eye {
            width: 24px;
            height: 24px;
            background: #06b6d4;
            border-radius: 50%;
            box-shadow: 0 0 15px #06b6d4, 0 0 30px #06b6d4;
            animation: blink 5s infinite;
        }

 
        .avatar-glow::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 30px;
            width: 50px;
            height: 25px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: rotate(-20px);
        }

      
        .info-box {
            color: white;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
        }

     
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                box-shadow: 0 0 50px rgba(139, 92, 246, 0.4);
            }
            50% {
                transform: translateY(-20px) rotate(3deg);
                box-shadow: 0 25px 70px rgba(59, 130, 246, 0.6);
            }
        }

   
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }
    </style>
</head>
<body>

    <div class="container">
       
        <div class="avatar-glow">
            <div class="avatar-face">
                <div class="eyes-container">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
        </div>

    
        <div class="info-box">
            <h1>AI Assistant UI</h1>
            <p>Next-Gen Futuristic Dashboard Component</p>
        </div>
    </div>

</body>
</html>
